# Render Blueprint — deploy backend + frontend + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: chatbot-db
    plan: free
    databaseName: chatbot
    user: chatbot

services:
  - type: web
    name: chatbot-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: chatbot-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://chatbot-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
