# Render Blueprint — 100% Free Tier (No Credit Card / Payment Required)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chatbot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:///./chatbot.db
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: chatbot-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://chatbot-backend-b7df.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
